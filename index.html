<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineAfro • Catálogo Interativo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="container">
    <header class="hero">
      <span class="eyebrow">Cinema & Resistência</span>
      <h1 class="brand-title">Cine<span>Afro</span></h1>
      <p class="brand-subtitle">Curadoria visual de narrativas, memória e identidade negra no cinema.</p>
    </header>

    <section class="summary-grid">
      <div class="metric-card">
        <div class="metric-icon">🎬</div>
        <div>
          <span class="metric-value" id="totalCount">0</span>
          <span class="metric-label">Obras no Catálogo</span>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon">✨</div>
        <div>
          <span class="metric-value" id="watchedCount">0</span>
          <span class="metric-label">Assistidos</span>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon">⏳</div>
        <div>
          <span class="metric-value" id="pendingCount">0</span>
          <span class="metric-label">Para Assistir</span>
        </div>
      </div>
    </section>

    <section class="glass-panel form-panel">
      <div class="panel-header">
        <h2>Adicionar Nova Obra</h2>
        <p>Cadastre filmes, animações ou documentários com suas informações essenciais.</p>
      </div>

      <form id="movieForm" novalidate>
        <div class="form-grid">
          <div class="form-group full-width">
            <label for="title">Título da Obra</label>
            <input type="text" id="title" placeholder="Ex: Besouro, Medida Provisória..." required>
          </div>

          <div class="form-group full-width">
            <label for="posterUrl">URL do Pôster / Imagem (Opcional)</label>
            <input type="url" id="posterUrl" placeholder="https://exemplo.com/poster.jpg">
          </div>

          <div class="form-group">
            <label for="category">Categoria</label>
            <div class="select-wrapper">
              <select id="category" required>
                <option value="">Selecione...</option>
                <option value="Ficção Histórica">Ficção Histórica</option>
                <option value="Animação">Animação</option>
                <option value="Documentário">Documentário</option>
                <option value="Drama">Drama</option>
                <option value="Ação/Capoeira">Ação/Capoeira</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="year">Ano de Lançamento</label>
            <input type="number" id="year" min="1890" max="2030" placeholder="Ex: 2009" required>
          </div>
        </div>

        <div class="form-footer">
          <label class="custom-checkbox">
            <input type="checkbox" id="watched">
            <span class="checkmark"></span>
            <span class="checkbox-label">Marcar como já assistido</span>
          </label>

          <button type="submit" class="btn btn-primary">
            <span>Cadastrar Obra</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>

        <div id="formError" class="error-banner" style="display: none;"></div>
      </form>
    </section>

    <section class="controls-panel">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Pesquisar por título...">
      </div>

      <div class="filter-box">
        <select id="filterCategory">
          <option value="TODAS">Todas as Categorias</option>
          <option value="Ficção Histórica">Ficção Histórica</option>
          <option value="Animação">Animação</option>
          <option value="Documentário">Documentário</option>
          <option value="Drama">Drama</option>
          <option value="Ação/Capoeira">Ação/Capoeira</option>
        </select>
      </div>
    </section>

    <section>
      <div id="movieGrid" class="cards-grid"></div>
      <div id="emptyMessage" class="empty-state" style="display: none;"></div>
    </section>
  </div>

  <script src="dist/app.js"></script>
</body>
</html>
